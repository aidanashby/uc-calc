# Builds the installable plugin zip for a version tag and attaches it to the
# GitHub release that the WordPress updater (inc/updater.php) reads.
#
# To release: bump the version in the uc-calc.php header and UC_CALC_VERSION,
# commit, then push a tag such as v1.1.0. A release you already drafted for
# the tag keeps its notes and gets the zip attached.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check plugin version matches tag
        run: |
          want="${TAG#v}"
          header=$(sed -n 's/^ \* Version: *//p' uc-calc.php)
          constant=$(sed -n "s/^define( 'UC_CALC_VERSION', '\(.*\)' );/\1/p" uc-calc.php)
          echo "tag=$want header=$header constant=$constant"
          [ "$header" = "$want" ] && [ "$constant" = "$want" ]

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm test

      - name: Check committed bundle is up to date
        run: |
          npm run build
          git diff --exit-code -- assets/

      - name: Build plugin zip
        run: git archive --format=zip --prefix=uc-calc/ -o uc-calc.zip "$TAG"

      - name: Publish release with zip
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" uc-calc.zip --clobber
          else
            requires=$(sed -n 's/^ \* Requires at least: *//p' uc-calc.php)
            requires_php=$(sed -n 's/^ \* Requires PHP: *//p' uc-calc.php)
            printf 'Requires at least: %s\nRequires PHP: %s\n\n' "$requires" "$requires_php" > notes.md
            gh release create "$TAG" uc-calc.zip --title "$TAG" --notes-file notes.md --generate-notes
          fi
